<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- QuizMaster favicon: the wordmark's two tones — "Q" in ink, "M" in
       the primary colour — on a rounded tile that follows the browser's
       light/dark mode. Values mirror the app's colour tokens. -->
  <style>
    .tile { fill: #ffffff; stroke: #e5e7eb; }
    .q { fill: #1a1a1a; }
    .m { fill: #6366f1; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1c1c1b; stroke: #343432; }
      .q { fill: #f2f2f0; }
      .m { fill: #818cf8; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="62" height="62" rx="14" stroke-width="2"/>
  <text x="32" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-1.5"><tspan class="q">Q</tspan><tspan class="m">M</tspan></text>
</svg>
