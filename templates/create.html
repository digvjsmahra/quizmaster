<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster</title>
  <link rel="icon" href="/static/favicon-32.png?v={{ asset_version }}" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/favicon.svg?v={{ asset_version }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ asset_version }}">
  <script src="/static/js/theme.js?v={{ asset_version }}"></script>
  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_version }}">
</head>
<body>
<div class="player-wrap">
  <div class="player-card">
    <h1 class="wordmark">Quiz<span>Master</span></h1>

    <div class="otp-label">Room code</div>
    <div class="otp-boxes" id="code-boxes">
      {% for i in range(4) %}
      <input class="otp-box" maxlength="1" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="{{ prefill_code[i] if prefill_code else '' }}">
      {% endfor %}
    </div>

    <div class="field-label">Your name</div>
    <input id="name-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off" spellcheck="false">

    {% if room_not_found %}
    <p class="error-msg" id="join-error">No room found with that code. Ask your host for the latest code.</p>
    {% else %}
    <p class="error-msg hidden" id="join-error"></p>
    {% endif %}

    <button id="join-btn" class="btn-primary" disabled>Join room</button>

    <div class="or-divider"><span>or</span></div>

    <form method="POST" action="/rooms">
      <button type="submit" class="btn-ghost">Host a new game →</button>
    </form>
  </div>
</div>
<script src="/static/js/create.js?v={{ asset_version }}"></script>
</body>
</html>
