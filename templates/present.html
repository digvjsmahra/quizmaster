<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster — Presentation</title>
  <link rel="stylesheet" href="/static/css/styles.css?v={{ asset_version }}">
</head>
<body>
<div class="present-wrap">

  <header class="present-header">
    <span id="present-board-label" class="present-board-label">Waiting for quiz content…</span>
  </header>

  <div class="present-layout">

    <!-- Stage: centers a fixed-aspect-ratio box that letterboxes to fit
         whatever space is available, without fighting flexbox for sizing
         (see present-stage-box). -->
    <div class="present-stage" id="present-stage">
      <div class="present-stage-box" id="present-stage-box">
        <span class="reviewing-badge hidden" id="present-reviewing-badge">reviewing</span>

        <div class="present-board-slide" id="present-board-slide">
          <div class="board-grid-wrap">
            <div class="board-grid" id="present-board-grid"></div>
          </div>
        </div>

        <div class="present-question-slide hidden" id="present-question-slide">
          <div class="present-question-text" id="present-question-text"></div>
          <div class="present-question-media" id="present-question-media"></div>
          <div class="present-answer" id="present-answer"></div>
        </div>

        <div class="present-answer-slide hidden" id="present-answer-slide">
          <div class="present-answer-slide-text" id="present-answer-slide-text"></div>
          <div class="present-answer-slide-media" id="present-answer-slide-media"></div>
        </div>
      </div>
    </div>

    <!-- Persistent sidebar: totals + queue, independent of the stage -->
    <div class="present-sidebar">
      <div class="card">
        <div class="totals-title">Totals</div>
        <table class="totals-table">
          <thead>
            <tr>
              <th></th>
              <th>Board</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="present-totals-body"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="queue-header">
          <span class="queue-title">Buzz queue</span>
          <span class="queue-gap-label">gap from first</span>
        </div>
        <div id="present-queue-locked-badge" class="queue-locked-badge hidden">🔒 frozen</div>
        <ol class="queue-list" id="present-queue-list"></ol>
        <div class="queue-empty hidden" id="present-queue-empty">no buzzes yet</div>
      </div>
    </div>

  </div>
</div>
<script src="/static/js/socket.io.min.js?v={{ asset_version }}"></script>
<script>
  // If the Socket.IO client failed to load, every entry script below would
  // die on its first io() call and leave a page whose buttons do nothing.
  // Say so instead.
  if (!window.io) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div class="script-load-error">' +
        '<p>This page didn\'t load properly and won\'t work until it\'s reloaded.</p>' +
        '<button type="button" class="btn-primary" id="script-load-reload">Reload</button>' +
      '</div>');
    document.getElementById('script-load-reload')
      .addEventListener('click', function () { location.reload(); });
  }
</script>
<script>const JOIN_CODE = "{{ join_code }}"; const HOST_TOKEN = "{{ host_token }}";</script>
<script src="/static/js/media.js?v={{ asset_version }}"></script>
<script src="/static/js/present.js?v={{ asset_version }}"></script>
</body>
</html>
